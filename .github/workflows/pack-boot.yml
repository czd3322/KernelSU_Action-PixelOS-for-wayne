    - name: Download kernel artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.event.inputs.run_id }}
        name: KernelSU-wayne
        path: ./
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract and locate kernel
      run: |
        # 列出下载的文件，方便排查
        ls -la
        # 解压第一层 zip
        if [ -f *.zip ]; then
          unzip -o *.zip -d extracted
        fi
        # 查找内核文件（Image.gz 或 Image.gz-dtb）
        KERNEL_FILE=$(find extracted -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -1)
        if [ -z "$KERNEL_FILE" ]; then
          echo "❌ 未找到内核镜像，当前文件列表："
          find extracted -type f
          exit 1
        fi
        cp "$KERNEL_FILE" ./kernel
        echo "✅ 内核文件已准备: $(ls -lh ./kernel)"
