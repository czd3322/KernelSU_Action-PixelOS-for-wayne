name: Pack Boot Image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '源构建的 run-id'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  pack:
    name: Pack boot.img from existing kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download mkbootimg tools
      run: |
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1

    - name: Download kernel artifact via API
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUN_ID="${{ github.event.inputs.run_id }}"
        REPO="${{ github.repository }}"
        ARTIFACT_NAME="KernelSU-wayne"

        echo "Fetching artifact info for run $RUN_ID..."
        # 获取 artifact 下载 URL
        ARTIFACT_URL=$(curl -s \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
          | jq -r --arg NAME "$ARTIFACT_NAME" '.artifacts[] | select(.name == $NAME) | .archive_download_url')
        
        if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" = "null" ]; then
          echo "❌ 未找到 artifact: $ARTIFACT_NAME"
          echo "尝试列出所有 artifact："
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" | jq '.artifacts[] | {name, id}'
          exit 1
        fi

        echo "✅ 找到 artifact，开始下载..."
        curl -L -H "Authorization: Bearer $GH_TOKEN" -o kernel.zip "$ARTIFACT_URL"
        unzip -j kernel.zip -d .
        echo "下载完成，目录内容："
        ls -la

        # 重命名内核文件
        if [ -f Image.gz-dtb ]; then
          mv Image.gz-dtb kernel
        elif [ -f KernelSU-wayne ]; then
          mv KernelSU-wayne kernel
        else
          echo "❌ 未找到内核镜像，尝试查找任何大文件："
          find . -size +10M -type f
          exit 1
        fi
        echo "✅ 内核镜像已准备: $(ls -lh kernel)"

    - name: Download source boot image
      run: |
        wget -O boot-source.img https://github.com/czd3322/wayne-files/raw/refs/heads/main/boot.img

    - name: Pack boot.img
      run: |
        mkdir -p out
        python tools/unpack_bootimg.py --boot_img boot-source.img
        cp kernel out/kernel
        BASE=$(cat out/base)
        PAGESIZE=$(cat out/pagesize)
        CMDLINE=$(cat out/cmdline)
        KERNEL_OFFSET=$(cat out/kernel_offset 2>/dev/null || echo "0x00080000")
        RAMDISK_OFFSET=$(cat out/ramdisk_offset 2>/dev/null || echo "0x01000000")
        TAGS_OFFSET=$(cat out/tags_offset 2>/dev/null || echo "0x00000100")
        HEADER_VERSION=$(cat out/header_version 2>/dev/null || echo "0")
        python tools/mkbootimg.py \
          --kernel out/kernel \
          --ramdisk out/ramdisk \
          --cmdline "$CMDLINE" \
          --base $BASE \
          --pagesize $PAGESIZE \
          --kernel_offset $KERNEL_OFFSET \
          --ramdisk_offset $RAMDISK_OFFSET \
          --tags_offset $TAGS_OFFSET \
          --header_version $HEADER_VERSION \
          -o boot.img
        if [ -f boot.img ]; then
          echo "✅ boot.img 生成成功！"
          ls -lh boot.img
        else
          echo "❌ boot.img 生成失败"
          exit 1
        fi

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: boot.img
        path: boot.img
