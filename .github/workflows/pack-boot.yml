name: Pack Boot Image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '源构建的 run-id'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  pack:
    name: Pack boot.img from existing kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download mkbootimg tools
      run: |
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1

    - name: Download kernel artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.event.inputs.run_id }}
        name: KernelSU-wayne
        path: ./
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract nested zip and locate kernel
      run: |
        # 如果直接下载得到的是 zip，先解压
        if [ -f kernel.zip ]; then
          unzip -j kernel.zip -d extracted
          cd extracted
        fi
        
        # 现在可能会有另一个 zip 文件（如 KernelSU-wayne-LineageOS20.zip）
        NESTED_ZIP=$(ls *.zip 2>/dev/null | head -1)
        if [ -n "$NESTED_ZIP" ]; then
          echo "发现嵌套 zip: $NESTED_ZIP，正在解压..."
          unzip -j "$NESTED_ZIP" -d ..
          cd ..
        fi
        
        # 现在查找内核镜像（支持 Image.gz、Image.gz-dtb、Image）
        KERNEL_FILE=""
        if [ -f Image.gz-dtb ]; then
          KERNEL_FILE="Image.gz-dtb"
        elif [ -f Image.gz ]; then
          KERNEL_FILE="Image.gz"
        elif [ -f Image ]; then
          KERNEL_FILE="Image"
        fi
        
        if [ -z "$KERNEL_FILE" ]; then
          echo "❌ 未找到内核镜像，当前目录内容："
          ls -la
          exit 1
        fi
        
        # 重命名为 kernel（供后续使用）
        mv "$KERNEL_FILE" kernel
        echo "✅ 内核镜像已准备: $KERNEL_FILE -> kernel"
        ls -lh kernel

    - name: Download source boot image
      run: |
        wget -O boot-source.img https://github.com/czd3322/wayne-files/raw/refs/heads/main/boot.img

    - name: Pack boot.img
      run: |
        mkdir -p out
        
        # 解包模板
        python tools/unpack_bootimg.py --boot_img boot-source.img
        
        # 替换内核
        cp kernel out/kernel
        
        # 读取参数（如果某些文件不存在，使用默认值）
        BASE=$(cat out/base)
        PAGESIZE=$(cat out/pagesize)
        CMDLINE=$(cat out/cmdline)
        KERNEL_OFFSET=$(cat out/kernel_offset 2>/dev/null || echo "0x00080000")
        RAMDISK_OFFSET=$(cat out/ramdisk_offset 2>/dev/null || echo "0x01000000")
        TAGS_OFFSET=$(cat out/tags_offset 2>/dev/null || echo "0x00000100")
        HEADER_VERSION=$(cat out/header_version 2>/dev/null || echo "0")
        
        # 打包
        python tools/mkbootimg.py \
          --kernel out/kernel \
          --ramdisk out/ramdisk \
          --cmdline "$CMDLINE" \
          --base $BASE \
          --pagesize $PAGESIZE \
          --kernel_offset $KERNEL_OFFSET \
          --ramdisk_offset $RAMDISK_OFFSET \
          --tags_offset $TAGS_OFFSET \
          --header_version $HEADER_VERSION \
          -o boot.img
        
        if [ -f boot.img ]; then
          echo "✅ boot.img 生成成功！"
          ls -lh boot.img
        else
          echo "❌ boot.img 生成失败"
          exit 1
        fi

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: boot.img
        path: boot.img
