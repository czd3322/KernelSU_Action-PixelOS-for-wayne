name: Pack Boot Image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '源构建的 run-id'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  pack:
    name: Pack boot.img from existing kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download mkbootimg tools
      run: |
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1

    - name: Download kernel artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        run_id: ${{ github.event.inputs.run_id }}
        name: KernelSU-wayne
        path: ./
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract nested zip and locate kernel
      run: |
        # 解压第一层 zip（如果有）
        if [ -f kernel.zip ]; then
          unzip -o kernel.zip -d extracted
          cd extracted
        fi
        
        # 解压第二层 zip（如果有），使用 -o 强制覆盖，避免交互提示
        NESTED_ZIP=$(ls *.zip 2>/dev/null | head -1)
        if [ -n "$NESTED_ZIP" ]; then
          echo "发现嵌套 zip: $NESTED_ZIP，正在解压（强制覆盖）..."
          unzip -o "$NESTED_ZIP" -d extracted2
          cd extracted2
        fi
        
        echo "当前目录内容："
        ls -la
        
        # 查找内核镜像（支持 Image.gz、Image.gz-dtb、Image）
        KERNEL_FILE=$(find . -name "Image.gz" -o -name "Image.gz-dtb" -o -name "Image" | head -1)
        
        if [ -z "$KERNEL_FILE" ]; then
          echo "❌ 未找到内核镜像，尝试搜索整个目录："
          find . -type f -size +1M | head -10
          exit 1
        fi
        
        # 复制到工作目录并重命名为 kernel
        cp "$KERNEL_FILE" ../kernel
        cd ../..
        echo "✅ 内核镜像已准备: $(ls -lh kernel)"

    - name: Download source boot image
      run: |
        wget -O boot-source.img https://github.com/czd3322/wayne-files/raw/refs/heads/main/boot.img

    - name: Pack boot.img
      run: |
        mkdir -p out
        
        # 解包模板，指定输出目录 out/
        python tools/unpack_bootimg.py --boot_img boot-source.img --out out
        
        # 替换内核
        cp kernel out/kernel
        
        # 读取参数（现在 out/ 下应该有这些文件）
        BASE=$(cat out/base)
        PAGESIZE=$(cat out/pagesize)
        CMDLINE=$(cat out/cmdline)
        KERNEL_OFFSET=$(cat out/kernel_offset 2>/dev/null || echo "0x00080000")
        RAMDISK_OFFSET=$(cat out/ramdisk_offset 2>/dev/null || echo "0x01000000")
        TAGS_OFFSET=$(cat out/tags_offset 2>/dev/null || echo "0x00000100")
        HEADER_VERSION=$(cat out/header_version 2>/dev/null || echo "0")
        
        # 打包
        python tools/mkbootimg.py \
          --kernel out/kernel \
          --ramdisk out/ramdisk \
          --cmdline "$CMDLINE" \
          --base $BASE \
          --pagesize $PAGESIZE \
          --kernel_offset $KERNEL_OFFSET \
          --ramdisk_offset $RAMDISK_OFFSET \
          --tags_offset $TAGS_OFFSET \
          --header_version $HEADER_VERSION \
          -o boot.img
        
        if [ -f boot.img ]; then
          echo "✅ boot.img 生成成功！"
          ls -lh boot.img
        else
          echo "❌ boot.img 生成失败"
          exit 1
        fi

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: boot.img
        path: boot.img
