name: Build KernelSU for wayne (PixelOS 12)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelSU Action
        uses: actions/checkout@v3
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget cpio
      - name: Clone kernel source (PixelOS wayne)
        run: |
          git clone --depth=1 -b twelve https://github.com/PixelOS-Devices/kernel_xiaomi_wayne.git kernel
      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          mkdir -p out
          make O=out wayne_defconfig
          make O=out -j$(nproc)
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 KernelSU-wayne-PixelOS12.zip *
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: KernelSU-wayne
          path: anykernel/KernelSU-wayne-PixelOS12.zip
