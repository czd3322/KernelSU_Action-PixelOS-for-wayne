name: Build KernelSU for wayne (LineageOS 20 - lineage-20.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelSU Action
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Clone kernel source (LineageOS wayne lineage-20.0)
        uses: actions/checkout@v4
        with:
          repository: LineageOS-wayne/android_kernel_xiaomi_wayne
          ref: lineage-20.0
          path: kernel

      - name: Disable appended DTB
        run: |
          cd kernel
          sed -i 's/^CONFIG_ARM64_APPENDED_DTB=y/# CONFIG_ARM64_APPENDED_DTB is not set/' arch/arm64/configs/vendor/wayne_defconfig
          echo "# CONFIG_ARM64_APPENDED_DTB is not set" >> arch/arm64/configs/vendor/wayne_defconfig

      - name: Integrate KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build kernel (Image.gz)
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          mkdir -p out
          make O=out vendor/wayne_defconfig
          make O=out -j$(nproc) Image.gz KCFLAGS="-Wno-error"
          ls -lh out/arch/arm64/boot/Image.gz

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          cd anykernel
          zip -r9 KernelSU-wayne-LineageOS20.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-wayne
          path: anykernel/KernelSU-wayne-LineageOS20.zip
